<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>タイピング練習</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=5">
</head>

<body>
  <div id="app">

    <!-- ============ 0. ようこそ / 設定画面 ============ -->
    <section id="screen-welcome" class="screen active">
      <div class="card">
        <h1>タイピング練習</h1>
        <div class="field">
          <label for="pid-input">参加者番号</label>
          <input type="text" id="pid-input" inputmode="numeric" pattern="[0-9]*" placeholder="事前にお伝えした番号を入力してください" autocomplete="off">
        </div>
        <p id="pid-error" class="hint" style="color: var(--critical); display:none;"></p>
        <div class="button-row" style="flex-direction: column; gap: 10px; margin-top: 15px;">
          <button id="btn-start-survey" class="btn btn-primary">アンケートを始める（約2分）</button>
          <button id="btn-resume-session" class="btn btn-secondary" style="display:none;">前回の続きから始める</button>
          <button id="btn-reset-welcome" class="btn btn-danger" style="display:none;">データをリセットして最初から</button>
        </div>
      </div>
    </section>

    <!-- ============ 1. アンケート画面 ============ -->
    <section id="screen-survey" class="screen">
      <div class="card">
        <h2>アンケート</h2>
        <p class="hint" style="margin-bottom: 1rem;">各項目について、あなた自身にどのくらい当てはまるかを5段階で評価してください。</p>
        <div id="survey-form"></div>
        <div class="button-row" style="margin-top: 1.5rem;">
          <button id="btn-survey-submit" class="btn btn-primary" disabled>診断結果を見る</button>
        </div>
      </div>
    </section>

    <!-- ============ 2. 判定中 ============ -->
    <section id="screen-analyzing" class="screen">
      <div class="card center">
        <div class="spinner" aria-hidden="true"></div>
        <p id="analyzing-text">回答を分析しています...</p>
        <div class="skeleton-lines" aria-hidden="true"><span class="skeleton line"></span><span class="skeleton line w80"></span><span class="skeleton line w60"></span></div>
      </div>
    </section>

    <!-- ============ 3. 判定結果 ============ -->
    <section id="screen-result" class="screen">
      <div class="card">
        <h2>あなたのゲーミフィケーションタイプ</h2>
        <div id="result-badge" class="type-badge"></div>
        <p id="result-rationale" class="lead"></p>

        <div id="result-chart" class="bar-chart" role="img" aria-label="6タイプのスコア"></div>

        <div class="button-row">
          <button id="btn-goto-setup" class="btn btn-primary">タイピング練習へ進む</button>
        </div>
      </div>
    </section>

    <!-- ============ 4. ゲーム設定（タイプ別） ============ -->
    <section id="screen-setup" class="screen">
      <div class="card">
        <h2 id="setup-title">練習の準備</h2>
        <div id="setup-body"></div>
        <div class="button-row">
          <button id="btn-start-game" class="btn btn-primary">スタート</button>
        </div>
        <div id="setup-stats-body"></div>
      </div>
    </section>

    <!-- ============ 5. タイピング画面 ============ -->
    <section id="screen-game" class="screen">
      <div class="card">
        <div id="game-hud" class="game-hud"></div>

        <div id="game-sentence" class="game-sentence">
          <div id="game-kanji" class="game-kanji"></div>
          <div id="game-reading" class="game-reading"></div>
          <div id="game-romaji" class="game-romaji"></div>
          <div id="game-next-preview" class="game-next-preview"></div>
        </div>

        <div id="game-side-panel" class="game-side-panel"></div>

        <div class="button-row">
          <button id="btn-end-session" class="btn btn-tertiary">終了して結果を見る</button>
        </div>
      </div>
    </section>

    <!-- ============ 6. ゲーム結果 ============ -->
    <section id="screen-postgame" class="screen">
      <div class="card">
        <div id="clear-status-banner" class="clear-banner"></div>
        <h2>結果</h2>
        <div id="postgame-stats" class="stats-grid"></div>
        <div id="postgame-gamification" class="gamification-box"></div>

        <div id="postgame-rediagnose-prompt"></div>

        <div class="study-step" id="secret-export-ui" style="display: none;">
          <p class="step-label">STEP 1</p>
          <h3>研究データをダウンロード</h3>
          <p class="hint">この端末に保存されたプレイ記録（<span id="log-count">0</span>件）をCSVで保存してください。</p>
          <button id="btn-export-csv" class="btn btn-primary">CSVをダウンロード</button>
        </div>

        <div class="survey-cta-box" id="survey-cta-box">
          <p class="step-label">STEP 2</p>
          <p class="survey-cta-text">プレイありがとうございました！最後にアンケートへのご協力をお願いします。</p>
          <p id="participant-id-display" class="hint" style="display:none;"></p>
          <button id="btn-goto-survey" class="btn btn-primary" disabled><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/></svg>アンケートに回答する</button>
          <p id="survey-step-note" class="hint">STEP 1 のCSVダウンロード後に押せるようになります。</p>
        </div>

        <div class="button-row">
          <button id="btn-play-again" class="btn btn-primary">もう一度プレイ</button>
          <button id="btn-back-setup" class="btn btn-secondary">設定に戻る</button>
        </div>


      </div>
    </section>

  </div>
  <script src="icons.js"></script>
  <script src="survey-data.js"></script>
  <script src="script-survey-only.js"></script>
</body>

</html>
